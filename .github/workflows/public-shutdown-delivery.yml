name: Public shutdown delivery
# An explicit read-only production audit. Candidate PRs are never compared
# against an older deployed release; deployment owns its own post-flight checks.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  delivery:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        target: [helper, worker, pages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Independently check the selected public origin
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            helper) node tools/verify-shutdown.cjs ;;
            worker) node tools/verify-public-release.cjs --worker --attempts=3 ;;
            pages) node tools/verify-public-release.cjs --attempts=3 ;;
          esac
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: public-audit-${{ matrix.target }}
          path: .cloudflare/*.json
          include-hidden-files: true
          retention-days: 14
