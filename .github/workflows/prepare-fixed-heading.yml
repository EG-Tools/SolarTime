name: Prepare fixed-direction random rotation
on:
  push:
    branches: [release/v0.48-r3-fixed-heading]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply only the checksum-matched candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          checks=json.loads(Path('tools/fixed-heading-r3-checks.json').read_text())
          for name,hashes in checks.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==hashes['before'], 'Base mismatch: '+name
          subprocess.run(['python','tools/prepare-fixed-heading-r3.py','.'],check=True)
          for name,hashes in checks.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==hashes['after'], 'Candidate mismatch: '+name
          print('All 12 changed files match the locally tested candidate.')
          for name in ['tools/prepare-fixed-heading-r3.py','tools/fixed-heading-r3-checks.json','.github/workflows/prepare-fixed-heading.yml']:
              Path(name).unlink()
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build:cloudflare
      - name: Commit the verified candidate on its isolated branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m "Keep one random camera heading until OFF (v0.48 r3)"
          git push origin HEAD:refs/heads/release/v0.48-r3-fixed-heading
