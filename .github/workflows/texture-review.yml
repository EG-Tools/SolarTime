name: Apply reviewed progressive textures
on:
  push:
    branches: [perf/closeup-textures-v0.63]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'EG-Tools/SolarTime'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/closeup-textures-v0.63
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Apply exact reviewed ordinary-source delta
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),z=require('zlib'),c=require('crypto');
          const hash=b=>c.createHash('sha256').update(b).digest('hex');
          const files=[1,2,3].map(n=>'.maintenance/texture-v063-'+n+'.b64');
          const raw=z.brotliDecompressSync(Buffer.from(files.map(f=>fs.readFileSync(f,'utf8').trim()).join(''),'base64'));
          if(hash(raw)!=='b7209d59dc4f6226d1ac32ce0f224edd299cc110ad2104cf294610a651cb4261')throw Error('Reviewed source hash mismatch');
          const allowed=new Set(['CHANGELOG.md','cloudflare/worker.js','docs/closeup-textures-v063.md','i18n/releases.json','index.html','package-lock.json','package.json','src/app.js','src/performance.js','src/release-notes.js','src/renderer.js','src/surface.js','tests/browser/closeup_textures.py','tests/browser/ui-regression.py','tests/closeup-textures.test.cjs','tests/fixtures/texture-v062-hashes.json','tests/local-model.test.cjs','tests/resource-lifecycle.test.cjs','tests/texture-media-cache.test.cjs','tools/deployment.cjs','tools/verify-textures.cjs','version.json']);
          const rows=JSON.parse(raw);if(rows.length!==allowed.size)throw Error('File count mismatch');
          for(const row of rows){
            if(!allowed.delete(row.path))throw Error('Unapproved or duplicate path');
            const exists=fs.existsSync(row.path);if(exists!==(row.before!==null))throw Error('Source existence changed: '+row.path);
            let bytes=exists?fs.readFileSync(row.path):Buffer.alloc(0);
            if(exists&&hash(bytes)!==row.before)throw Error('Baseline changed: '+row.path);
            let last=bytes.length+1;
            for(const [at,remove,text] of [...row.edits].reverse()){
              if(!Number.isInteger(at)||!Number.isInteger(remove)||at<0||remove<0||at+remove>bytes.length||at>=last||typeof text!=='string')throw Error('Invalid edit');
              bytes=Buffer.concat([bytes.subarray(0,at),Buffer.from(text,'utf8'),bytes.subarray(at+remove)]);last=at;
            }
            if(hash(bytes)!==row.after)throw Error('Result hash mismatch: '+row.path);
            fs.mkdirSync(path.dirname(row.path),{recursive:true});fs.writeFileSync(row.path,bytes);
          }
          for(const f of files)fs.rmSync(f);
          NODE
      - run: npm ci
      - name: Locked-dependency full suite and both production builds
        run: |
          set -euo pipefail
          mkdir -p .cloudflare
          npm test 2>&1 | tee .cloudflare/texture-unit-tests.log
          node tools/build-cloudflare.cjs 2>&1 | tee .cloudflare/texture-worker-build.log
          node tools/build-pages.cjs 2>&1 | tee .cloudflare/texture-pages-build.log
      - name: Commit ordinary sources to the review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github'
          git diff --cached --check
          git commit -m 'v0.63: medium-first closeups with bounded original-4K reuse and cache verification'
          git push origin HEAD:perf/closeup-textures-v0.63
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: texture-source-validation
          path: .cloudflare/texture-*.log
          include-hidden-files: true
          retention-days: 7
