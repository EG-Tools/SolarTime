name: Verify v0.47 candidate
on:
  push:
    branches: [release/v0.47]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: solartime-v047-candidate
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Prepare reviewed migration without publishing
        run: |
          npm install --prefix .maintenance/deps --no-package-lock --ignore-scripts --no-audit --no-fund postcss@8.5.6
          python .maintenance/prepare_v047.py
          python .maintenance/add_singapore.py
          python .maintenance/finalize_checks.py
      - name: Test candidate
        run: |
          npm test
          for f in src/*.js; do node --check "$f"; done
          npm run build:cloudflare
      - name: Save candidate source for independent review
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/solar-candidate"
          tar --exclude=.git --exclude=node_modules --exclude=.maintenance/deps --exclude=.cloudflare --exclude=.wrangler -czf "$RUNNER_TEMP/solar-candidate/source.tar.gz" .
          git diff --stat > "$RUNNER_TEMP/solar-candidate/changes.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: solartime-v047-candidate
          path: ${{ runner.temp }}/solar-candidate
          retention-days: 7
      - name: Record verified candidate on release branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src index.html styles.css version.json package.json package-lock.json tests tools cloudflare README.md CHANGELOG.md docs
          git diff --cached --quiet || git commit -m 'Prepare Solar Time v0.47 with shared cards and Singapore English region'
          git push origin HEAD:release/v0.47
