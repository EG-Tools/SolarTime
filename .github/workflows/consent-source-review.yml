name: Consent source review
on:
  push:
    branches: [feature/consent-controls-v0.66]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 50c1300876a2cb59d02550ce73d01e42b87cd304
          persist-credentials: false
      - name: Archive reviewed source
        run: |
          mkdir -p .source-review
          git archive --format=zip HEAD -o .source-review/source.zip
          git rev-parse HEAD > .source-review/snapshot-commit.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: consent-source-baseline
          path: .source-review
          include-hidden-files: true
          retention-days: 3
