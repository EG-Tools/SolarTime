name: Apply reviewed consent controls
on:
  push:
    branches: [feature/consent-controls-v0.66]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Apply only hash-locked reviewed consent edits
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,pathlib
          root=pathlib.Path.cwd()
          parts=sorted(root.glob('.review-consent/*.b64'))
          assert len(parts)==21
          data=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)
          assert hashlib.sha256(data).hexdigest()=='b637c4c215988a86c13f4e50fe7f670a900864d93cd5033f8181e7b943fb2515'
          edits=json.loads(gzip.decompress(data))['files']
          assert len(edits)==38
          seen=set()
          for entry in edits:
              rel=pathlib.PurePosixPath(entry['path'])
              assert not rel.is_absolute() and '..' not in rel.parts and rel.parts[0] not in ['.git','.github']
              assert str(rel) not in seen
              seen.add(str(rel))
              path=root/rel
              if entry['before'] is None:
                  assert not path.exists()
                  original=b''
              else:
                  original=path.read_bytes()
                  assert hashlib.sha256(original).hexdigest()==entry['before'],str(rel)
              text=original.decode('utf-8')
              for start,end,replacement in reversed(entry['edits']):
                  text=text[:start]+replacement+text[end:]
              result=text.encode('utf-8')
              assert hashlib.sha256(result).hexdigest()==entry['after'],str(rel)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(result)
          PY
          git rm -r .review-consent .github/workflows/consent-source-review.yml
      - run: npm ci
      - name: Generate sources and require the reviewed final tree
        run: |
          npm run build:i18n
          git add -A
          test "$(git write-tree)" = 99a7eddc1d0cb58e78389f435636ee873466b0be
          mkdir -p .cloudflare
          git write-tree > .cloudflare/reviewed-tree.txt
      - name: Locked dependency tests and both site builds
        run: |
          set -o pipefail
          npm test 2>&1 | tee .cloudflare/unit-tests.log
          npm run build:cloudflare 2>&1 | tee .cloudflare/build.log
          node tools/build-pages.cjs 2>&1 | tee .cloudflare/pages-build.log
          npm run check:i18n
          npm run check:cache
      - name: Commit reviewed source only to the feature branch
        run: |
          git add -A
          test "$(git write-tree)" = 99a7eddc1d0cb58e78389f435636ee873466b0be
          git config user.name 'Life User'
          git config user.email '260633483+EG-Tools@users.noreply.github.com'
          git commit -m 'v0.66: six-month consent choices, neutral close and accessible cookie settings'
          git push origin HEAD:feature/consent-controls-v0.66
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: consent-source-validation
          path: |
            .cloudflare/*.log
            .cloudflare/reviewed-tree.txt
          include-hidden-files: true
          retention-days: 7
