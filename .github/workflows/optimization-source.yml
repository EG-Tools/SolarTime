name: Optimization source snapshot
on:
  push:
    branches: [optimization/runtime-v0.59]
    paths: [.github/workflows/optimization-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          mkdir -p .optimization-results
          git rev-parse HEAD > .optimization-results/commit.txt
          git archive --format=zip -o .optimization-results/source.zip HEAD
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: optimization-source
          path: .optimization-results
          include-hidden-files: true
          retention-days: 3
