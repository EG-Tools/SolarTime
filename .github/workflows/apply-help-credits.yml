name: Apply reviewed help credits
on:
  push:
    branches: [fix/help-music-credits-v0.60-r2]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'EG-Tools/SolarTime'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/help-music-credits-v0.60-r2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Apply the exact reviewed credit-only patch
        run: |
          node <<'NODE'
          const z=require('zlib'),c=require('crypto'),cp=require('child_process');
          const encoded='';
          const patch=z.brotliDecompressSync(Buffer.from(encoded,'base64'));
          if(c.createHash('sha256').update(patch).digest('hex')!=='0c63165c4fe45f0724d265320a247f87724c7c0c821275067bd262d14aad438a')throw Error('Reviewed patch hash mismatch');
          for(const flags of [['--check'],[]]){const r=cp.spawnSync('git',['apply','--unidiff-zero',...flags,'-'],{input:patch,stdio:['pipe','inherit','inherit']});if(r.status!==0)throw Error('Patch failed');}
          NODE
      - name: Focused tests and both static builds
        run: |
          node --test tests/help-credits.test.cjs tests/timer.test.cjs tests/page-runtime.test.cjs
          node tools/build-cloudflare.cjs
          node tools/build-pages.cjs
      - name: Commit ordinary reviewed source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md index.html src/app.js src/runtime-optimizations.css tests/browser/ui-regression.py tests/help-credits.test.cjs version.json
          git diff --cached --check
          git commit -m 'Add requested Suno and Pixabay author credit links (v0.60 r2)'
          git push origin HEAD:fix/help-music-credits-v0.60-r2
