name: Alarm music verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: alarm-music-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm ci
      - name: Full regression suite
        run: |
          set -o pipefail
          mkdir -p .alarm-results
          npm test 2>&1 | tee .alarm-results/tests.log
      - run: npm run build:cloudflare
      - name: Record tested source
        if: always()
        run: |
          mkdir -p .alarm-results
          git rev-parse HEAD > .alarm-results/tested-commit.txt
          git archive --format=zip -o .alarm-results/source.zip HEAD
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: alarm-music-verification
          path: .alarm-results
          include-hidden-files: true
          retention-days: 7
