name: Apply reviewed CI maintenance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'maintenance/verified-pipeline-1-5'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: maintenance/verified-pipeline-1-5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Apply exact reviewed patch; no production credentials
        run: |
          node - <<'NODE'
          const fs=require('fs'),z=require('zlib'),c=require('crypto'),cp=require('child_process');
          const patch=z.brotliDecompressSync(Buffer.from(fs.readFileSync('.maintenance/ci-pipeline.b64','utf8').trim(),'base64'));
          if(c.createHash('sha256').update(patch).digest('hex')!=='aec0078104bad046150e348f6a1e94a0278fd00020983fcee92ae5ebc9b41ddd')throw Error('Reviewed patch mismatch');
          for(const extra of [['--check'],[]]){const r=cp.spawnSync('git',['apply',...extra,'-'],{input:patch,stdio:['pipe','inherit','inherit']});if(r.status!==0)throw Error('Patch failed');}
          fs.rmSync('.maintenance/ci-pipeline.b64');fs.rmSync('.github/workflows/apply-ci-pipeline.yml');
          const changed=cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n');
          if(changed.some(p=>/^(src\/|index\.html|styles\.css|version\.json|windows\/|cloudflare\/)/.test(p)))throw Error('Runtime changes are outside phase 1-5');
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run build:cloudflare
      - name: Commit only to the requested maintenance branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Consolidate verification, guard exact-main deployments and preserve failure diagnostics'
          git push origin HEAD:maintenance/verified-pipeline-1-5
