name: Shutdown verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: shutdown-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  shutdown:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm ci
      - name: Full regression suite and build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .shutdown-results -Force | Out-Null
          npm test 2>&1 | Tee-Object .shutdown-results/node-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Node tests failed' }
          npm run build:cloudflare
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Windows PowerShell 5.1 installation and safe native-command tests
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/windows-shutdown.integration.ps1 2>&1 | Tee-Object .shutdown-results/windows-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows integration tests failed' }
      - name: Record exact tested source
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .shutdown-results -Force | Out-Null
          git rev-parse HEAD | Set-Content .shutdown-results/tested-commit.txt
          git archive --format=zip -o .shutdown-results/source.zip HEAD
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: shutdown-verification
          path: .shutdown-results
          include-hidden-files: true
          retention-days: 7
  cloudflare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/shutdown-confirmed-v0.57'
    needs: shutdown
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: '4640527a19614f7b65a034f422704b64'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Check existing deployment authorization without exposing it
        id: authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment credential is configured.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'CLOUDFLARE_NOT_DEPLOYED: no CLOUDFLARE_API_TOKEN is configured. Dashboard URL does not authorize API writes.'
          fi
      - if: steps.authorization.outputs.available == 'true'
        run: npm ci
      - name: Coordinated R2 and Worker deployment, then public verification
        if: steps.authorization.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/deploy-shutdown.cjs --apply
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always() && steps.authorization.outputs.available == 'true'
        with:
          name: shutdown-cloudflare-verification
          path: .cloudflare/*verification.json
          include-hidden-files: true
          retention-days: 7
