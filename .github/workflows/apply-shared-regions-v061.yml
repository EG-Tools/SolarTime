name: Apply reviewed shared regions
on:
  push:
    branches: [feature/shared-regions-v0.61]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'EG-Tools/SolarTime'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Apply reviewed byte-offset delta to ordinary sources only
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),z=require('zlib'),crypto=require('crypto');
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const raw=z.brotliDecompressSync(fs.readFileSync('.maintenance/shared-regions-v061.br'));
          if(hash(raw)!=='2033a59b4a0c4a2df2ada78d0dba1f1597def1aaecae2328ac9bf4263a880fc2')throw Error('Reviewed delta hash mismatch');
          const allowed=new Set(['CHANGELOG.md','docs/shared-regions-v061.md','index.html','package-lock.json','package.json','src/app.js','src/localization.js','src/release-notes.js','src/runtime-optimizations.css','styles.css','tests/auto-language.test.cjs','tests/browser/region_menu.py','tests/browser/ui-regression.py','tests/fixtures/regions-v061.json','tests/netherlands-belgium.test.cjs','tests/shared-regions.test.cjs','tests/taiwan-hong-kong.test.cjs','tests/v046-release.test.cjs','version.json']);
          const rows=JSON.parse(raw);if(rows.length!==allowed.size)throw Error('File count mismatch');
          for(const row of rows){
            if(!allowed.delete(row.path))throw Error('Unapproved or duplicate path');
            const exists=fs.existsSync(row.path);if(exists!==(row.before!==null))throw Error('Source existence changed: '+row.path);
            let bytes=exists?fs.readFileSync(row.path):Buffer.alloc(0);
            if(exists&&hash(bytes)!==row.before)throw Error('Baseline changed: '+row.path);
            let last=bytes.length+1;
            for(const [at,remove,text] of [...row.edits].reverse()){
              if(!Number.isInteger(at)||!Number.isInteger(remove)||at<0||remove<0||at+remove>bytes.length||at>=last||typeof text!=='string')throw Error('Invalid edit');
              bytes=Buffer.concat([bytes.subarray(0,at),Buffer.from(text,'utf8'),bytes.subarray(at+remove)]);last=at;
            }
            if(hash(bytes)!==row.after)throw Error('Result hash mismatch: '+row.path);
            fs.mkdirSync(path.dirname(row.path),{recursive:true});fs.writeFileSync(row.path,bytes);
          }
          fs.rmSync('.maintenance/shared-regions-v061.br');
          NODE
      - run: npm ci
      - name: Locked-dependency full suite and both site builds
        run: |
          set -o pipefail
          mkdir -p .cloudflare
          npm test 2>&1 | tee .cloudflare/regions-unit-tests.log
          node tools/build-cloudflare.cjs 2>&1 | tee .cloudflare/regions-worker-build.log
          node tools/build-pages.cjs 2>&1 | tee .cloudflare/regions-pages-build.log
      - name: Commit only ordinary sources on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github'
          git diff --cached --check
          git commit -m 'v0.61: fixed AUTO menu and 13 shared-language country/time regions'
          git push origin HEAD:feature/shared-regions-v0.61
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: shared-regions-source-validation
          path: .cloudflare/regions-*.log
          include-hidden-files: true
          retention-days: 7
