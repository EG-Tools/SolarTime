name: Apply reviewed translation sources
on:
  push:
    branches: [refactor/translation-source-v0.62]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'EG-Tools/SolarTime'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Apply reviewed hash-locked translation source migration
        run: |
          node - <<'NODE'
          'use strict';
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),z=require('node:zlib'),vm=require('node:vm');
          const root=process.cwd(),hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const encoded=Buffer.from([1,2,3].map(n=>fs.readFileSync('.maintenance/i18n-'+n+'.b64','utf8').trim()).join(''),'base64');
          const raw=z.brotliDecompressSync(encoded);if(hash(raw)!=='c1c66599034aeb0aa7c43887e27ecf2445e4bdc1e9500d6d78363c4643073ee5')throw Error('Reviewed translation delta hash mismatch');
          const p=JSON.parse(raw),base={};const safe=f=>typeof f==='string'&&!f.startsWith('.')&&!f.includes('..')&&!f.includes('\\')&&!path.isAbsolute(f)&&/^(?:src|tools|tests|i18n)\//.test(f)||['CHANGELOG.md','package.json','package-lock.json','index.html','version.json'].includes(f);
          for(const [file,expected] of Object.entries(p.base)){if(!safe(file))throw Error('Invalid base path');const bytes=fs.readFileSync(file);if(hash(bytes)!==expected)throw Error('Baseline changed: '+file);base[file]=bytes.toString('utf8');}
          const seen=new Set();for(const row of p.files){
           if(!safe(row.path)||seen.has(row.path))throw Error('Invalid target');seen.add(row.path);const exists=fs.existsSync(row.path);if(exists!==(row.before!==null))throw Error('Target existence changed: '+row.path);
           let bytes=exists?fs.readFileSync(row.path):Buffer.alloc(0);if(exists&&hash(bytes)!==row.before)throw Error('Target changed: '+row.path);
           if(row.delete){fs.unlinkSync(row.path);continue;}let last=bytes.length+1;
           for(const [at,remove,text] of [...row.edits].reverse()){if(!Number.isInteger(at)||!Number.isInteger(remove)||at<0||remove<0||at+remove>bytes.length||at>=last||typeof text!=='string')throw Error('Invalid byte edit');bytes=Buffer.concat([bytes.subarray(0,at),Buffer.from(text),bytes.subarray(at+remove)]);last=at;}
           fs.mkdirSync(path.dirname(row.path),{recursive:true});fs.writeFileSync(row.path,bytes);
          }
          // Fixed-hash migration extracts existing copy; no translation API is called.
          new Function('fs','path','vm','root','base','latestRelease','require',p.bootstrap)(fs,path,vm,root,base,p.latestRelease,require);
          require(path.join(root,'tools/i18n.cjs')).sync(root,{write:true});require(path.join(root,'tools/code-revisions.cjs')).sync(root,{write:true});
          for(const [file,expected] of Object.entries(p.expected)){if(!safe(file))throw Error('Invalid verification path');if(expected===null){if(fs.existsSync(file))throw Error('Expected removal: '+file);}else if(!fs.existsSync(file)||hash(fs.readFileSync(file))!==expected)throw Error('Result hash mismatch: '+file);}
          for(const n of [1,2,3])fs.rmSync('.maintenance/i18n-'+n+'.b64',{force:true});
          console.log('Exact reviewed translation source verified for '+Object.keys(p.expected).length+' files.');
          NODE
      - run: npm ci
      - name: Locked-dependency full suite and both production builds
        run: |
          set -o pipefail
          mkdir -p .source-review
          npm test 2>&1 | tee .source-review/unit-tests.log
          node tools/build-cloudflare.cjs 2>&1 | tee .source-review/worker-build.log
          node tools/build-pages.cjs 2>&1 | tee .source-review/pages-build.log
          node tools/i18n.cjs --report > .source-review/i18n-report.json
      - name: Commit reviewed ordinary sources to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github' ':(exclude).source-review'
          git diff --cached --check
          git commit -m 'v0.62: authoritative translation sources, generated runtime and consistent validation'
          git push origin HEAD:refactor/translation-source-v0.62
          git rev-parse HEAD > .source-review/commit.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: translation-source-validation
          path: .source-review
          include-hidden-files: true
          retention-days: 7
