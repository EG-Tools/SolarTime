name: Verify Solar Time
on:
  push:
    branches: [main, release/v0.47]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: unit (${{ matrix.os }}, ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Complete unit suite and platform build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .cloudflare
          npm test 2>&1 | tee .cloudflare/unit-tests.log
          npm run build:cloudflare 2>&1 | tee .cloudflare/build.log
          node tools/build-pages.cjs 2>&1 | tee .cloudflare/pages-build.log
      - name: Windows PowerShell 5.1 helper checks (mock shutdown only)
        if: matrix.os == 'windows-latest' && matrix.node == '22'
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/windows-shutdown.integration.ps1 2>&1 | Tee-Object .cloudflare/windows-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows helper integration failed' }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: unit-${{ matrix.os }}-node-${{ matrix.node }}
          path: .cloudflare/*.log
          include-hidden-files: true
          retention-days: 14
  browser:
    name: browser (${{ matrix.suite }})
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        suite: [ui, tiny-star]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify failure-diagnostic capture
        if: matrix.suite == 'ui'
        run: python tests/browser/diagnostics-selftest.py
      - name: Independent browser regression
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .cloudflare
          python tests/browser/${{ matrix.suite }}-regression.py 2>&1 | tee .cloudflare/browser.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: browser-${{ matrix.suite }}-diagnostics
          path: |
            .cloudflare/*.json
            .cloudflare/browser.log
            .cloudflare/browser-artifacts/
          include-hidden-files: true
          retention-days: 14
  verified:
    name: verified
    if: always()
    needs: [unit, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every candidate check
        env:
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          test "$UNIT" = success && test "$BROWSER" = success
          echo "All required checks passed for $GITHUB_SHA. No production deployment is part of this verification workflow." >> "$GITHUB_STEP_SUMMARY"
