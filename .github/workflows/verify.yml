name: Verify Solar Time
on:
  push:
    branches: [main, release/v0.47]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:cloudflare
  browser:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser/ui-regression.py
      - run: python tests/browser/tiny-star-regression.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ui-regression-results
          path: |
            .cloudflare/ui-regression.json
            .cloudflare/tiny-star-regression.json
          include-hidden-files: true
          retention-days: 14
  public:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Verify the served Pages release and existing official icon
        run: node tools/verify-public-release.cjs --attempts=24
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: public-release-verification
          path: .cloudflare/public-verification.json
          include-hidden-files: true
          retention-days: 14
