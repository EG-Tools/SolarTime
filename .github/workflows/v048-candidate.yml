name: Prepare v0.48 camera candidate
on:
  push:
    branches: [release/v0.48-camera]
    paths: ['.maintenance/v048/**']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python3 .maintenance/v048/prepare.py apply
      - run: npm ci
      - run: npm test
      - run: for file in src/*.js; do node --check "$file"; done
      - run: npm run build:cloudflare
      - name: Record verified source on candidate branch only
        run: python3 .maintenance/v048/prepare.py record
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: camera-candidate-verification
          path: .cloudflare/candidate-verification.json
          include-hidden-files: true
          retention-days: 7
